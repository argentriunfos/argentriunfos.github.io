name: Revisar fuentes

# Cada lunes revisa que todos los links de fuentes sigan funcionando.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-links.mjs
